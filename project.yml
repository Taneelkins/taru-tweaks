name: TaruTweaks
options:
  bundleIdPrefix: com.taru
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "406A561CA32DEA4B4713C3ABA5A453E9AB1DF475"
    DEVELOPMENT_TEAM: A734F6NRJG
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
targets:
  TaruTweaksHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
      - path: Shared/BatteryProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks.helper
        SWIFT_OBJC_BRIDGING_HEADER: Helper/smc.h
        SKIP_INSTALL: YES
  TaruTweaks:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Modules
        excludes: ["TaskManager/**"]
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Helper/com.taru.tweaks.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: TaruTweaksHelper
        embed: true
        copy:
          destination: executables
      - target: TaruWallpaper
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Taru Tweaks
        CFBundleDisplayName: Taru Tweaks
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "Taru · personal build"
        NSAudioCaptureUsageDescription: "Taru Tweaks sets each app's volume on its own in the Volume Mixer."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks
        PRODUCT_NAME: "Taru Tweaks"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
  TaruWallpaper:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WallpaperExtension
        excludes: ["LICENSE-Phosphene", "Info.plist", "Wallpaper.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks.wallpaper
        PRODUCT_NAME: TaruWallpaper
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WallpaperExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Taru Tweaks Wallpaper
        CODE_SIGN_ENTITLEMENTS: WallpaperExtension/Wallpaper.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: WallpaperExtension/WallpaperExtension-Bridging-Header.h
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
        SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  TaskManager:
    type: application
    platform: macOS
    sources:
      - path: TaskManagerApp
      - path: Modules/TaskManager
      - path: Shared/Theme.swift
      - path: Shared/SettingsKit.swift
      - path: Resources/TaskManager.icns
        buildPhase: resources
    info:
      path: Resources/TaskManager-Info.plist
      properties:
        CFBundleName: Task Manager
        CFBundleDisplayName: Task Manager
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconFile: TaskManager
        NSHumanReadableCopyright: "Taru · personal build"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.taskmanager
        PRODUCT_NAME: "Task Manager"
        GENERATE_INFOPLIST_FILE: NO
