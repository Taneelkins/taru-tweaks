name: TaruTweaks
options:
  bundleIdPrefix: com.taru
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "406A561CA32DEA4B4713C3ABA5A453E9AB1DF475"
    DEVELOPMENT_TEAM: A734F6NRJG
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    exactVersion: 0.5.15
targets:
  TaruTweaksHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
      - path: Shared/BatteryProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks.helper
        SWIFT_OBJC_BRIDGING_HEADER: Helper/smc.h
        SKIP_INSTALL: YES
  TaruTweaksWatchdog:
    type: tool
    platform: macOS
    sources:
      - path: Watchdog
        excludes: ["*.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks.watchdog
        SKIP_INSTALL: YES
  TaruTweaks:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Modules
        excludes: ["TaskManager/**", "ModelViewer/**"]
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Helper/com.taru.tweaks.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Watchdog/com.taru.tweaks.watchdog.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: TaruTweaksHelper
        embed: true
        copy:
          destination: executables
      - target: TaruTweaksWatchdog
        embed: true
        copy:
          destination: executables
      - target: TaruWallpaper
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Taru Tweaks
        CFBundleDisplayName: Taru Tweaks
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "Taru · personal build"
        NSAudioCaptureUsageDescription: "Taru Tweaks sets each app's volume on its own in the Volume Mixer."
        NSDocumentsFolderUsageDescription: "The Model Viewer opens 3D models you keep in Documents."
        NSDesktopFolderUsageDescription: "The Model Viewer opens 3D models you keep on the Desktop."
        NSDownloadsFolderUsageDescription: "The Model Viewer opens 3D models you keep in Downloads."
        NSRemovableVolumesUsageDescription: "The Model Viewer opens 3D models on external drives."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks
        PRODUCT_NAME: "Taru Tweaks"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
  TaruWallpaper:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WallpaperExtension
        excludes: ["LICENSE-Phosphene", "Info.plist", "Wallpaper.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.tweaks.wallpaper
        PRODUCT_NAME: TaruWallpaper
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WallpaperExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Taru Tweaks Wallpaper
        CODE_SIGN_ENTITLEMENTS: WallpaperExtension/Wallpaper.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: WallpaperExtension/WallpaperExtension-Bridging-Header.h
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
        SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  ModelViewer:
    type: application
    platform: macOS
    sources:
      - path: ModelViewerApp
      - path: Modules/ModelViewer
        excludes: ["LICENSE-GLTFKit2"]
      - path: Shared/Theme.swift
      - path: Shared/ClosureItem.swift
      - path: Shared/SettingsKit.swift
      - path: Resources/ModelViewer.icns
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    postBuildScripts:
      - name: Bundle Assimp (FBX converter)
        basedOnDependencyAnalysis: false
        script: |
          # Copies Homebrew's assimp tool + library into the app so .fbx opens without Homebrew; skipped when it isn't installed
          for p in /opt/homebrew/opt/assimp /usr/local/opt/assimp; do [ -x "$p/bin/assimp" ] && A="$p" && break; done
          [ -z "$A" ] && { echo "warning: assimp not found, Model Viewer will open .fbx only if Homebrew assimp is installed"; exit 0; }
          C="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$C/Helpers" "$C/Frameworks"
          cp -f "$A/bin/assimp" "$C/Helpers/assimp"
          cp -fL "$A/lib/libassimp.6.dylib" "$C/Frameworks/libassimp.6.dylib"
          chmod u+w "$C/Helpers/assimp" "$C/Frameworks/libassimp.6.dylib"
          install_name_tool -id @rpath/libassimp.6.dylib "$C/Frameworks/libassimp.6.dylib" 2>/dev/null
          install_name_tool -add_rpath @executable_path/../Frameworks "$C/Helpers/assimp" 2>/dev/null || true
          codesign -f -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$C/Frameworks/libassimp.6.dylib"
          codesign -f -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$C/Helpers/assimp"
    info:
      path: Resources/ModelViewer-Info.plist
      properties:
        CFBundleName: Model Viewer
        CFBundleDisplayName: Model Viewer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconFile: ModelViewer
        NSHumanReadableCopyright: "Taru · personal build"
        CFBundleDocumentTypes:
          - CFBundleTypeName: USD model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.pixar.universal-scene-description-mobile, com.pixar.universal-scene-description]
          - CFBundleTypeName: OBJ model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.geometry-definition-format]
          - CFBundleTypeName: glTF model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.khronos.glb, org.khronos.gltf]
          - CFBundleTypeName: FBX model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.autodesk.fbx, com.autodesk.mac.fbx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.autodesk.fbx
            UTTypeDescription: FBX model
            UTTypeConformsTo: [public.3d-content, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fbx]
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: glTF binary model
            UTTypeConformsTo: [public.3d-content, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [glb]
              public.mime-type: [model/gltf-binary]
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: glTF model
            UTTypeConformsTo: [public.3d-content, public.json]
            UTTypeTagSpecification:
              public.filename-extension: [gltf]
              public.mime-type: [model/gltf+json]
        NSDocumentsFolderUsageDescription: "The Model Viewer opens 3D models you keep in Documents."
        NSDesktopFolderUsageDescription: "The Model Viewer opens 3D models you keep on the Desktop."
        NSDownloadsFolderUsageDescription: "The Model Viewer opens 3D models you keep in Downloads."
        NSRemovableVolumesUsageDescription: "The Model Viewer opens 3D models on external drives."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.modelviewer
        PRODUCT_NAME: "Model Viewer"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
  TaskManager:
    type: application
    platform: macOS
    sources:
      - path: TaskManagerApp
      - path: Modules/TaskManager
      - path: Shared/Theme.swift
      - path: Shared/SettingsKit.swift
      - path: Resources/TaskManager.icns
        buildPhase: resources
    info:
      path: Resources/TaskManager-Info.plist
      properties:
        CFBundleName: Task Manager
        CFBundleDisplayName: Task Manager
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconFile: TaskManager
        NSHumanReadableCopyright: "Taru · personal build"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taru.taskmanager
        PRODUCT_NAME: "Task Manager"
        GENERATE_INFOPLIST_FILE: NO
